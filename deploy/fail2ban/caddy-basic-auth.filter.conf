# fail2ban filter: wrong basic-auth credentials on Caddy sites (JSON access log).
# Install as /etc/fail2ban/filter.d/caddy-basic-auth.conf. See docs/HOSTING.md → fail2ban.
#
# Matches only 401s on requests that *sent* credentials (Caddy logs the header as
# ["REDACTED"]). A browser's first visit always gets one 401 without credentials before the
# login prompt — those must not count, or ordinary visits would add up to a ban.
[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"headers":\{[^}]*"Authorization":\["REDACTED"\].*"status":401[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
